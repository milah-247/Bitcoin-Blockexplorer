[package]
name = "block-explorer"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
bitcoin = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip", "http2"] }
moka = { version = "0.12.16", features = ["future"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "fs"] }
