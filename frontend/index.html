<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Block Explorer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f7931a'/%3E%3Cpath d='M9 10h14v4H9zM9 18h14v4H9z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Block Explorer</span>
        <span class="net" id="net" hidden></span>
      </a>
      <form class="search" id="search" role="search" autocomplete="off">
        <input id="q" name="q" type="search" spellcheck="false"
               placeholder="Height, block hash, txid or address"
               aria-label="Search by height, block hash, transaction id or address" maxlength="128">
        <button type="submit">Search</button>
      </form>
    </div>
  </header>

  <main class="wrap" id="app" tabindex="-1" aria-live="polite"></main>

  <footer class="wrap footer">
    <span id="footer-tip"></span>
    <span id="footer-index"></span>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
